apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-runtime-rendered
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 11.0.1
    helm:
      valueFiles:
        - ../helm/grafana-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-runtime-rendered
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
