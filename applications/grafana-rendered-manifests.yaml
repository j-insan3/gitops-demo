apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-rendered-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/j-insan3/gitops-demo.git
    targetRevision: HEAD
    path: rendered-manifests/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-rendered-manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
